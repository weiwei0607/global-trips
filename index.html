    .count { text-align: center; padding: 12px; font-size: 0.85rem; color: #888; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding: 20px; }

    .card-meta { font-size: 0.85rem; color: #666; margin-bottom: 10px; display: flex; gap: 12px; }

let searchQuery = "";
let filterRegion = "all";

function renderCards() {
  const grid = document.getElementById('grid');
  const q = searchQuery.toLowerCase();

  const filtered = itineraries.filter(item => {
    if (q && !item.title.toLowerCase().includes(q) && !item.country.toLowerCase().includes(q)) {
      return false;
    }
    if (filterRegion !== "all" && item.region !== filterRegion) {
      return false;
    }
    return true;
  });

  grid.innerHTML = filtered.map(item => {
    const budget = item.budget.match(/US\$(\d+)[–-](\d+)/);
    const avgBudget = budget ? Math.round((parseInt(budget[1]) + parseInt(budget[2])) / 2) : 50;

    return `
      <div class="card" onclick="showDetail(${item.id})">
        <div class="card-title">${item.title}</div>
        <div class="card-meta">
          <span>🕐 ${item.duration}</span>
          <span>💰 US$${avgBudget}/day</span>
        </div>
        <span class="card-tag">${item.region}</span>
        <span class="card-tag">${item.country}</span>
        <div class="card-stops">
          ${item.stops.slice(1, 3).map(s => `<div class="stop-item"><span class="stop-time">${s.time}</span> ${s.name}</div>`).join('')}
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('countBar').textContent = `顯示 ${filtered.length} 條行程（共 ${itineraries.length} 條）`;
}

function showDetail(id) {
  const item = itineraries.find(i => i.id === id);
  if (!item) return;

  const html = `
    <div class="modal-title">${item.title}</div>
    <div class="cost-detail">
      <strong>⏱️ 時間：</strong> ${item.duration}<br>
      <strong>💰 預算：</strong> ${item.budget}<br>
      <strong>🌍 地區：</strong> ${item.region} / ${item.country}<br>
      <strong>🚌 交通：</strong> ${item.transport}
    </div>
    <div style="margin-top: 16px;">
      <strong>🎯 行程：</strong><br>
      ${item.stops.map(s => `<div style="padding: 4px 0;">
        <span style="color: #e74c3c; font-weight: 600;">${s.time}</span> <strong>${s.name}</strong>
      </div>`).join('')}
    </div>
    <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #eee;">
      <strong>💡 秘訣：</strong> ${item.tip}
    </div>
  `;

  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderCards();
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-filter="region"]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterRegion = btn.dataset.value;
    renderCards();
  });
});

document.getElementById('luckyBtn').addEventListener('click', () => {
  const random = itineraries[Math.floor(Math.random() * itineraries.length)];
  showDetail(random.id);
});

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

renderCards();
</script>
