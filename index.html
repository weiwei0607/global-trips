: "Indonesia", "style": ["自然探險"], "budget": "US$100–200", "budgetLevel": "high", "duration": "7hr", "transport": "巴士一日券", "stops": [{"time": "08:00", "name": "抵達 Bali", "desc": "從機場/車站到住宿區域"}, {"time": "09:00", "name": "Bali 老城區", "desc": "自然探險 · 必去景點"}, {"time": "11:00", "name": "Bali 美食街", "desc": "自然探險 · 必去景點"}, {"time": "13:00", "name": "Bali 博物館", "desc": "自然探險 · 必去景點"}, {"time": "15:00", "name": "Bali 公園", "desc": "自然探險 · 必去景點"}, {"time": "17:00", "name": "Bali 當地餐廳", "desc": "品嚐當地特色菜"}], "tip": "💡 用當地 SIM 卡卡或 eSIM，網路無限"}];

let searchQuery = "";
let filterRegion = "all";
let filterBudget = "all";
let activeDeparture = "taipei";

function parseBudget(budgetStr) {
  const match = budgetStr.match(/US\$(\d+)[–-](\d+)/);
  if (match) {
    return { low: parseInt(match[1]), high: parseInt(match[2]) };
  }
  return { low: 0, high: 0 };
}

function getFlightCost(region) {
  return flightCosts[region]?.[activeDeparture] || 10000;
}

function getTotalBudgetTWD(item) {
  const dayBudget = parseBudget(item.budget);
  const avgDay = (dayBudget.low + dayBudget.high) / 2 * 30;  // USD to TWD approx
  const durationDays = parseInt(item.duration) || 1;
  const tripCost = avgDay * durationDays;
  const flightCost = getFlightCost(item.region);
  return tripCost + flightCost;
}

function renderCards() {
  const grid = document.getElementById('grid');
  const q = searchQuery.toLowerCase();

  const filtered = itineraries.filter(item => {
    // 搜尋篩選
    if (q && !item.title.toLowerCase().includes(q) &&
        !item.country.toLowerCase().includes(q) &&
        !item.stops.some(s => s.name.toLowerCase().includes(q))) {
      return false;
    }

    // 地區篩選
    if (filterRegion !== "all" && item.region !== filterRegion) {
      return false;
    }

    // 預算篩選（總預算）
    if (filterBudget !== "all") {
      const totalBudget = getTotalBudgetTWD(item);
      if (filterBudget === "budget" && totalBudget >= 20000) return false;
      if (filterBudget === "mid" && (totalBudget < 20000 || totalBudget > 40000)) return false;
      if (filterBudget === "premium" && totalBudget <= 40000) return false;
    }

    return true;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-result">😢 找不到符合條件的行程，試試調整篩選</div>';
    document.getElementById('countBar').textContent = `顯示 0 條行程`;
    return;
  }

  grid.innerHTML = filtered.map(item => {
    const budget = parseBudget(item.budget);
    const avgDay = Math.round((budget.low + budget.high) / 2);
    const durationDays = parseInt(item.duration) || 1;
    const tripCost = Math.round(avgDay * durationDays * 30);  // USD to approx TWD
    const flightCost = getFlightCost(item.region);
    const totalTWD = tripCost + flightCost;

    return `
      <div class="card" onclick="showDetail(${item.id})">
        <div class="card-title">${item.title}</div>
        <div class="card-meta">
          <span>🕐 ${item.duration}</span>
          <span>💰 NT$${totalTWD.toLocaleString()}</span>
        </div>
        <span class="card-region">${item.region}</span>
        <span class="card-country">${item.country}</span>
        <div class="card-stops">
          ${item.stops.slice(1, 5).map(s => `
            <div class="stop-item">
              <span class="stop-time">${s.time}</span> ${s.name}
            </div>
          `).join('')}
          ${item.stops.length > 5 ? `<div class="stop-item">... 還有 ${item.stops.length - 4} 站</div>` : ''}
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('countBar').textContent = `顯示 ${filtered.length} 條行程（共 ${itineraries.length} 條）`;
}

function showDetail(id) {
  const item = itineraries.find(i => i.id === id);
  if (!item) return;

  const budget = parseBudget(item.budget);
  const avgDay = Math.round((budget.low + budget.high) / 2);
  const durationDays = parseInt(item.duration) || 1;
  const tripCost = Math.round(avgDay * durationDays * 30);
  const flightCost = getFlightCost(item.region);
  const totalTWD = tripCost + flightCost;

  const html = `
    <div class="modal-title">${item.title}</div>
    <div class="cost-detail">
      <strong>⏱️ 時間：</strong> ${item.duration}<br>
      <strong>💰 每日預算：</strong> US$${avgDay}<br>
      <strong>🌍 地區：</strong> ${item.region} / ${item.country}<br>
      <strong>🚌 交通：</strong> ${item.transport}
    </div>
    <div class="cost-breakdown">
      <strong>📊 從台灣出發總成本估算：</strong><br>
      機票：NT$${flightCost.toLocaleString()}<br>
      行程費用（約${durationDays}天）：NT$${tripCost.toLocaleString()}<br>
      <strong>合計：NT$${totalTWD.toLocaleString()}</strong>
    </div>
    <div style="margin-top: 16px;">
      <strong>🎯 行程安排：</strong>
      <div style="margin-top: 8px;">
        ${item.stops.map(s => `<div style="padding: 4px 0;">
          <span style="color: #e74c3c; font-weight: 600; min-width: 50px;">${s.time}</span>
          <strong>${s.name}</strong><br>
          <span style="color: #888; font-size: 0.9rem;">${s.desc}</span>
        </div>`).join('')}
      </div>
    </div>
    <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #eee;">
      <strong>💡 背包客秘訣：</strong> ${item.tip}
    </div>
  `;

  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

// 出發地選擇
document.getElementById('departureSelect').addEventListener('change', e => {
  activeDeparture = e.target.value;
  renderCards();
});

// 搜尋
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderCards();
});

// 篩選按鈕
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const filter = btn.dataset.filter;
    const value = btn.dataset.value;

    document.querySelectorAll(`[data-filter="${filter}"]`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    if (filter === 'region') filterRegion = value;
    if (filter === 'budget') filterBudget = value;

    renderCards();
  });
});

// 隨機推薦
document.getElementById('luckyBtn').addEventListener('click', () => {
  const random = itineraries[Math.floor(Math.random() * itineraries.length)];
  showDetail(random.id);
});

// 關閉 modal 背景
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) {
    closeModal();
  }
});

renderCards();
</script>
