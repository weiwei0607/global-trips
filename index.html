    header {

      color: white;
      padding: 40px 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);

    .toolbar {

      padding: 16px 20px;
      display: flex;
      gap: 12px;

      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin: 20px;

    .search-box {

      min-width: 250px;
      display: flex;
      gap: 8px;
    }

    .search-box input {
      flex: 1;
      padding: 10px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
    }

    .search-box input:focus {
      outline: none;
      border-color: #667eea;
    }

    .lucky-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);

    .lucky-btn:hover {

    }

    .filters {
      background: white;
      padding: 20px;
      margin: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .filter-group {
      margin-bottom: 16px;
    }

    .filter-label {
      font-weight: 700;
      font-size: 0.9rem;
      color: #333;
      margin-bottom: 10px;
    }

    .filter-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      padding: 8px 16px;
      border: 2px solid #e0e0e0;
      background: white;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: #667eea;
      color: #667eea;
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-color: transparent;
    }

    .count {
      text-align: center;
      padding: 12px 20px;
      font-size: 0.9rem;
      color: #666;
      background: white;
      margin: 0 20px;
      border-radius: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
      border-color: #667eea;
    }

    .card-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 12px; }

    .card-meta {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .card-tags {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .tag {
      display: inline-block;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .stop-time { color: #667eea; font-weight: 700; min-width: 50px; }

      border-radius: 8px;
      margin-bottom: 16px;

    }

let searchQuery = "";
let filterRegion = "all";
let filterBudget = "all";

const flightCosts = {
  "Southeast Asia": 3000,
  "East Asia": 3500,
  "South Asia": 8000,
  "Europe": 18000,
  "Americas": 25000,
  "Africa & Middle East": 15000,
  "Oceania": 12000
};

function parseBudget(str) {
  const m = str.match(/US\$(\d+)[–-](\d+)/);
  return m ? {low: parseInt(m[1]), high: parseInt(m[2])} : {low: 50, high: 100};
}

function renderCards() {
  const grid = document.getElementById('grid');
  const q = searchQuery.toLowerCase();

  const filtered = itineraries.filter(item => {
    if (q && !item.title.toLowerCase().includes(q) && !item.country.toLowerCase().includes(q)) {
      return false;
    }
    if (filterRegion !== "all" && item.region !== filterRegion) {
      return false;
    }
    if (filterBudget !== "all" && item.budgetLevel !== filterBudget) {
      return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 80px 20px; color: #aaa;">找不到行程</div>';
    document.getElementById('countBar').textContent = `0 條行程`;
    return;
  }

  grid.innerHTML = filtered.map(item => {
    const budget = parseBudget(item.budget);
    const avgBudget = Math.round((budget.low + budget.high) / 2);
    const flight = flightCosts[item.region] || 10000;
    const durationHours = parseInt(item.duration);
    const dayFraction = durationHours / 24;
    const tripCost = Math.round(avgBudget * dayFraction * 30);  // 轉換為 TWD
    const totalTWD = tripCost + flight;

    return `
      <div class="card" onclick="showDetail(\${item.id})">
        <div class="card-title">\${item.title}</div>
        <div class="card-meta">
          <span>🕐 \${item.duration}</span>
          <span>💰 US\$\${avgBudget}/day</span>
          <span>📊 約 NT\$\${totalTWD.toLocaleString()}</span>
        </div>
        <div class="card-tags">
          <span class="tag">\${item.region}</span>
          <span class="tag">\${item.country}</span>
        </div>
        <div style="font-size: 0.85rem; margin: 8px 0; padding: 8px; background: #f9f9f9; border-radius: 4px;">
          <strong style="color: #667eea;">🚌 \${item.transport}</strong> — 約 NT\$\${Math.round(tripCost * 0.35).toLocaleString()}
        </div>
        <div class="card-stops">
          \${item.stops.slice(1, 3).map(s => '<div><span class="stop-time">' + s.time + '</span> ' + s.name + '</div>').join('')}
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('countBar').textContent = `顯示 \${filtered.length} 條行程（共 \${itineraries.length} 條）`;
}

function showDetail(id) {
  window.currentTripId = id;
  window.selectedRestaurants = {};
  
  const item = itineraries.find(i => i.id === id);
  if (!item) return;

  const budget = parseBudget(item.budget);
  const avgBudget = Math.round((budget.low + budget.high) / 2);
  const flight = flightCosts[item.region] || 10000;
  const tripCost = Math.round(((budget.low + budget.high) / 2) * parseInt(item.duration) * 30);
  const totalTWD = tripCost + flight;

  const html = `
    <div class="modal-title">\${item.title}</div>

    <div class="detail-box">
      <strong>✈️ 基本資訊</strong><br>
      時間：<strong>\${item.duration}</strong><br>
      地區：<strong>\${item.region} • \${item.country}</strong><br>
      交通：<strong>\${item.transport}</strong>
    </div>

    <div class="cost-box">
      <strong>💰 費用估算（從台灣出發）</strong><br>
      機票：<strong>NT\$\${flight.toLocaleString()}</strong><br>
      行程費用（\${parseInt(item.duration)}天）：<strong>NT\$\${tripCost.toLocaleString()}</strong><br>
      <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.1);">
        <strong style="font-size: 1.2rem; color: #667eea;">合計：NT\$\${totalTWD.toLocaleString()}</strong>
      </div>
    </div>

    <div class="detail-box">
      <strong>🎯 行程</strong><br>
      \${item.stops.map(s => `<div style="margin: 6px 0;"><span class="stop-time">\${s.time}</span> <strong>\${s.name}</strong><br><span style="color: #888; font-size: 0.9rem;">↳ \${s.desc}</span></div>`).join('')}
    </div>

    <div class="detail-box">
      <strong>💡 秘訣</strong><br>\${item.tip}
    </div>
  `;

  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  

function updateCost() {
  const id = window.currentTripId;
  const item = itineraries.find(i => i.id === id);
  if (!item) return;
  
  let extraCost = 0;
  item.stops.forEach((s, idx) => {
    if (s.restaurants) {
      const selected = document.querySelector(`input[name="rest_\${idx}"]:checked`);
      if (selected) {
        const restIdx = parseInt(selected.value);
        const rest = s.restaurants[restIdx];
        extraCost += rest.price * 30; // 轉為 TWD
      }
    }
  });
  
  const costDisplay = document.getElementById('extraCostDisplay');
  if (costDisplay) {
    costDisplay.innerHTML = extraCost > 0 ? `<div style="color: #e74c3c; margin-top: 8px;">+ 用餐額外成本：NT\$${extraCost.toLocaleString()}</div>` : '';
  }
}

renderCards();
});
